<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APTV App Installation Center</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      text-align: center;
    }

    header {
      padding: 35px 20px 25px;
      background: linear-gradient(180deg, #111827, #0b0f19);
    }

    .flag {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .subtitle {
      color: #b8c0cc;
      font-size: 16px;
      margin-top: 10px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    .section-title {
      font-size: 22px;
      margin: 10px 0 25px;
    }

    .devices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }

    .device {
      background: #151b28;
      border: 1px solid #293244;
      border-radius: 15px;
      padding: 25px 15px;
      text-decoration: none;
      color: white;
      display: block;
      transition: 0.2s;
    }

    .device:hover {
      transform: translateY(-3px);
      border-color: #3b82f6;
      background: #1b2434;
    }

    .icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .device h2 {
      font-size: 18px;
      margin: 8px 0;
    }

    .device p {
      color: #aeb7c5;
      font-size: 14px;
      margin: 0;
      line-height: 1.5;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      background: #1d4ed8;
    }

    .button:hover {
      background: #2563eb;
    }

    .help {
      margin-top: 35px;
      padding: 25px 18px;
      background: #151b28;
      border-radius: 15px;
      border: 1px solid #293244;
    }

    .help h2 {
      margin-top: 0;
    }

    footer {
      padding: 25px;
      color: #7f8a9b;
      font-size: 13px;
    }
 footer {
    padding: 25px;
    color: #7f8a9b;
    font-size: 13px;
}

.install-button {
    display: inline-block;
    padding: 12px 18px;
    margin: 6px;
    background: #202a3d;
    border: 1px solid #3a4860;
    border-radius: 8px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    transition: 0.2s;
}

.install-button:hover {
    background: #c8102e;
    border-color: #c8102e;
}
</style>
</head>

<body>

 <header>
    <h1>APTV</h1>
    <div class="subtitle">APTV App Installation Center</div>
</header>

  <main class="container">

   <div class="section-title">
  📲 Select Your Device
</div>

<div class="devices">

  <a href="firestick.html" class="install-button">
    🔥 Firestick / Fire TV
  </a>

  <a href="onn.html" class="install-button">
    📺 ONN 4K Pro / Android TV
  </a>

  <a href="android-phone.html" class="install-button">
    📱 Android Phone
  </a>

  <a href="android-tablet.html" class="install-button">
    📱 Android Tablet
  </a>

  <a href="android-tv.html" class="install-button">
    📺 Android Smart TV
  </a>

  <a href="apple.html" class="install-button">
    🍎 Apple Devices
  </a>

</div>

<div class="help">
  <h2>🆘 Need Help?</h2>
  <p>
    Having trouble installing APTV? Our support team is here to help.
  </p>
</div>

<div class="buttons">
  <a href="index.html" class="button">🏠 Back to APTV</a>
</div>
  </main>

  <footer>
    © 2026 • APTV
  </footer>

</body>
</html>
