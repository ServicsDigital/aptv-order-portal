<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APTV - 48-Hour Free Trial</title>

    <style>
      
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b0f18;
        color: #ffffff;
    }

    .container {
        width: 100%;
        max-width: 620px;
        margin: 30px auto;
        padding: 28px;
        background: #151d2b;
        border: 1px solid #34445f;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    h1 {
        text-align: center;
        margin: 0;
        font-size: 34px;
        font-weight: 800;
    }

    .subtitle {
        text-align: center;
        margin: 8px 0 25px;
        color: #ffffff;
        font-size: 24px;
        font-weight: 800;
    }

    .trial-box {
        background: #10285f;
        border-left: 5px solid #e51e3e;
        padding: 20px;
        border-radius: 9px;
        margin-bottom: 25px;
        text-align: center;
        line-height: 1.5;
    }

    .trial-box strong {
        font-size: 20px;
    }

    label {
        display: block;
        margin-top: 17px;
        margin-bottom: 7px;
        font-weight: 700;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 13px;
        border-radius: 7px;
        border: 1px solid #445572;
        background: #222d40;
        color: #ffffff;
        font-size: 16px;
        outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: #e51e3e;
    }

    textarea {
        min-height: 110px;
        resize: vertical;
    }

    .trial-submit {
        width: 100%;
        margin-top: 28px;
        padding: 16px;
        border: 2px solid #e51e3e;
        border-radius: 8px;
        background: #c51f3a;
        color: #ffffff;
        font-size: 18px;
        font-weight: 800;
        cursor: pointer;
    }

    .trial-submit:hover {
        background: #e51e3e;
    }

    .back-button {
        display: block;
        width: 100%;
        margin-top: 16px;
        padding: 13px;
        text-align: center;
        border: 1px solid #445572;
        border-radius: 7px;
        background: #202b3e;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
    }

    .back-button:hover {
        background: #2a3850;
    }

    .notice {
        margin-top: 20px;
        text-align: center;
        font-size: 13px;
        color: #aeb8ca;
    }

    @media (max-width: 650px) {
        .container {
            margin: 0;
            min-height: 100vh;
            border-radius: 0;
            padding: 20px;
        }

        h1 {
            font-size: 30px;
        }

        .subtitle {
            font-size: 21px;
        }
    }
</style> 
        }
    </style>
</head>

<body>

<div class="container">

    <h1>APTV</h1>

    <div class="subtitle">
        48-Hour Free Trial
    </div>

    <div class="trial-box">
        <strong>🎁 Try APTV FREE for 48 Hours!</strong>
        <br><br>
        Complete the form below to request your free trial.
    </div>

    <form action="https://formsubmit.co/Brywill39@gmail.com" method="POST">
<input type="hidden" name="_subject" value="APTV - New 48-Hour Free Trial Request">
<input type="hidden" name="_captcha" value="true">
<input type="hidden" name="_template" value="table">
        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
        

        <label for="device">Device</label>
        <select id="device" name="device" required>
            <option value="">Select your device</option>
            <option>Firestick</option>
            <option>Android TV</option>
            <option>ONN 4K Pro</option>
            <option>Smart TV</option>
            <option>Android Phone/Tablet</option>
            <option>Other</option>
        </select>

        <label for="notes">Additional Notes</label>
        <textarea
            id="notes"
            name="notes"
            placeholder="Anything else we should know?"
        ></textarea>

        <button type="submit" class="trial-submit">
            🎁 REQUEST 48-HOUR FREE TRIAL
        </button>

    <form action="https://formsubmit.co/Brywill39@gmail.com" method="POST"></form>

    <a href="index.html" class="back-button">
        ← Back to APTV Order Portal
    </a>

    <div class="notice">
        Trial requests are subject to approval.
    </div>

</div>

</body>
</html>
